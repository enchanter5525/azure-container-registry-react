name: Build and Push to ACR

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  REGISTRY: myfirstregistry1.azurecr.io
  IMAGE_NAME: my-react-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Debug Secrets
      run: |
        echo "Registry: ${{ env.REGISTRY }}"
        echo "Username length: ${{ secrets.ACR_USERNAME && 'set' || 'NOT SET' }}"
        echo "Password length: ${{ secrets.ACR_PASSWORD && 'set' || 'NOT SET' }}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to ACR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Generate timestamp
      id: timestamp
      run: echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ github.run_id }}
          type=raw,value=${{ steps.timestamp.outputs.date }}-${{ github.run_id }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Register Container Instance Provider
      run: |
        az provider register --namespace Microsoft.ContainerInstance
        echo "Waiting for provider registration..."
        for i in {1..30}; do
          STATUS=$(az provider show -n Microsoft.ContainerInstance --query registrationState -o tsv)
          echo "Registration status: $STATUS"
          if [ "$STATUS" = "Registered" ]; then
            echo "Provider registered successfully!"
            break
          fi
          echo "Waiting... ($i/30)"
          sleep 5
        done

    - name: Deploy to Dev
      run: |
        az container create \
          --resource-group my-developers \
          --name my-react-app-dev \
          --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop \
          --registry-login-server ${{ env.REGISTRY }} \
          --registry-username ${{ secrets.ACR_USERNAME }} \
          --registry-password ${{ secrets.ACR_PASSWORD }} \
          --environment-variables REACT_APP_API_URL=https://api-dev.example.com \
          --ports 80 \
          --os-type Linux \
          --ip-address Public \
          --cpu 1 \
          --memory 1 \
          --no-wait
        
        echo "Dev container instance created/updated"
        echo "IP Address: $(az container show --resource-group my-developers --name my-react-app-dev --query ipAddress.ip -o tsv)"

  deploy-prod:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Register Container Instance Provider
      run: |
        az provider register --namespace Microsoft.ContainerInstance
        echo "Waiting for provider registration..."
        for i in {1..30}; do
          STATUS=$(az provider show -n Microsoft.ContainerInstance --query registrationState -o tsv)
          echo "Registration status: $STATUS"
          if [ "$STATUS" = "Registered" ]; then
            echo "Provider registered successfully!"
            break
          fi
          echo "Waiting... ($i/30)"
          sleep 5
        done

    - name: Deploy to Production
      run: |
        az container create \
          --resource-group my-developers \
          --name my-react-app-prod \
          --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:master \
          --registry-login-server ${{ env.REGISTRY }} \
          --registry-username ${{ secrets.ACR_USERNAME }} \
          --registry-password ${{ secrets.ACR_PASSWORD }} \
          --environment-variables REACT_APP_API_URL=https://api.example.com \
          --ports 80 \
          --os-type Linux \
          --ip-address Public \
          --cpu 1 \
          --memory 1 \
          --no-wait
        
        echo "Production container instance created/updated"
        echo "IP Address: $(az container show --resource-group my-developers --name my-react-app-prod --query ipAddress.ip -o tsv)"
